name: Idea
description: Suggest a new demo or feature for the lab.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Check the
        [roadmap](https://github.com/Morpheus-Tech-LLC/morpheus-tech-lab/blob/main/ROADMAP.md)
        first, in case it's already there. To talk an idea through before proposing it, use
        [Discussions](https://github.com/Morpheus-Tech-LLC/morpheus-tech-lab/discussions).

        Work starts once a maintainer approves the idea with the `approved` label. An idea too
        big for one pull request is split into smaller issues then.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - A new demo
        - A feature
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it is
      description: Describe the demo or feature, and what a visitor would see and do with it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why it belongs in the lab, and who it helps.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: >-
        What a visitor can do once it ships, and what must still hold (for example, the GPU
        still gives exactly the CPU's generations). A maintainer settles it when approving the
        idea, in the approval comment that a pull request is reviewed against.
      placeholder: |
        - A visitor can ...
        - ... still works as before.
    validations:
      required: true
