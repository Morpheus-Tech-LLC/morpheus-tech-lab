name: Idea
description: Suggest a new demo or feature for the lab, in a few lines.
labels: ["idea"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Check the
        [roadmap](https://github.com/Morpheus-Tech-LLC/morpheus-tech-lab/blob/main/ROADMAP.md)
        first, in case it's already there. To talk an idea through before suggesting it, use
        [Discussions](https://github.com/Morpheus-Tech-LLC/morpheus-tech-lab/discussions).

        Keep it short: what it is and why. If a maintainer accepts it, its plan, including what
        it is done when, is worked out on this issue in the planning stage. CONTRIBUTING.md
        explains [how an issue moves](https://github.com/Morpheus-Tech-LLC/morpheus-tech-lab/blob/main/CONTRIBUTING.md#how-an-issue-moves).
  - type: textarea
    id: what
    attributes:
      label: What it is
      description: The demo or feature, and what a visitor would see and do with it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why it belongs in the lab, and who it helps.
    validations:
      required: true
