# Checks every pull request, and every push to the long-lived branches.
# The job names "build" and "DCO" are the required status checks on main. The build job also
# runs the tests, so they are required too.
name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Also runs the brand check (scripts/brand.mjs check).
      - run: npm run build
      # The unit tests (node:test, test/), so they are required wherever build is.
      - run: npm test

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                | sed 's/[[:space:]]*$//' | grep -qxF "$author"; then
              echo "::error::Commit ${sha:0:12} has no 'Signed-off-by: $author' line"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Sign off with 'git commit -s'. To fix commits already made:"
            echo "  git rebase --signoff \"$BASE\" && git push --force-with-lease"
          fi
          exit "$bad"
